<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Catchall</title>
  <meta name="description" content="One place for every note, list and scribble.">
  <meta name="theme-color" content="#efebe3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Catchall">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Notebooks">
      <div class="brand"><img src="icons/icon-192.png" alt="" width="30" height="30"> Catchall</div>
      <label class="search">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
        <input id="search" type="search" placeholder="Search everything" autocomplete="off" autocorrect="off" enterkeyhint="search" aria-label="Search all notes">
      </label>
      <nav id="nav-system" class="nav"></nav>
      <div class="nav-heading">
        <span>Notebooks</span>
        <button id="add-notebook" class="icon-btn small" aria-label="New notebook" title="New notebook">
          <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
        </button>
      </div>
      <nav id="nav-notebooks" class="nav"></nav>
      <nav id="nav-bottom" class="nav nav-bottom"></nav>
    </aside>
    <div id="nav-scrim"></div>
    <main id="main">
      <header class="main-head">
        <button id="menu-btn" class="icon-btn" aria-label="Show notebooks">
          <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>
        </button>
        <h1 id="view-title">Catchall</h1>
        <div id="view-actions"></div>
      </header>
      <div id="main-body"></div>
    </main>
  </div>

  <button id="fab" aria-label="New note" title="New note">
    <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
  </button>

  <section id="editor" hidden aria-label="Note">
    <header id="editor-bar"></header>
    <div id="editor-scroll"><div id="editor-page"></div></div>
  </section>

  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
