# Puts Brain Dump online on Cloudflare every time the code changes.
# Uses the Cloudflare API token saved as a repository secret (Settings → Secrets and variables → Actions).
name: Deploy Brain Dump

on:
  push:
    branches: ['claude/sweet-heisenberg-j6g5gs', 'main']
    paths-ignore: ['README.md']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Accept the most common names for the secret.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_KEY || secrets.CF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the Cloudflare token is available
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::No Cloudflare token found. Add a repository secret named CLOUDFLARE_API_TOKEN under Settings → Secrets and variables → Actions."
            exit 1
          fi
          npx wrangler whoami

      - name: Find or create the backup database
        run: |
          find_id() {
            npx wrangler d1 list --json 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const json = s.slice(s.indexOf("["));
                const db = JSON.parse(json).find((x) => x.name === "brain-dump");
                process.stdout.write(db ? db.uuid : "");
              });'
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            echo "Creating the brain-dump database…"
            npx wrangler d1 create brain-dump
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then echo "::error::Could not find or create the D1 database"; exit 1; fi
          echo "Using database $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml

      - name: Deploy
        run: npx wrangler deploy
